<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit timetable</title>
  <link rel="stylesheet" href="style1.css">

  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">

</head>
<body>
  <a class="back" href="index.html">← All days</a>
  <h1>Edit timetable</h1>

  <select id="daySelect">
    <option value="monday">Monday</option>
    <option value="tuesday">Tuesday</option>
    <option value="wednesday">Wednesday</option>
    <option value="thursday">Thursday</option>
    <option value="friday">Friday</option>
    <option value="saturday">Saturday</option>
    <option value="sunday">Sunday</option>
  </select>

  <div id="list"></div>

  <select id="subjectSelect"></select>

  <h2>Subjects</h2>
  <p id="firstRun" class="hint" hidden>Step 1: create your subjects in the Subjects section at the bottom. Step 2: pick a day here and add them in class order.</p><input id="newSubject" placeholder="New subject name">
  <button id="addSubjectBtn">Create subject</button>
  <div id="subjectList"></div>

  <script src="store.js"></script>
  <script src="edit.js"></script>
</body>
</html>
